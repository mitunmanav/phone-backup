name: CI

# Pull requests only: on main, Release runs the same checks before it publishes.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Windows checks
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      # Before cargo: build.rs embeds the APK in the app.
      - name: Build companion app
        run: companion\gradlew.bat -p companion assembleRelease

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Run tests
        run: cargo test --locked

      - name: Build release binary
        run: cargo build --locked --release

      # Merging a bot's pull request lists the bot as a contributor. The checks
      # above still show whether its update builds; copy it to your own branch.
      - name: Block merging Dependabot pull requests
        if: github.event.pull_request.user.login == 'dependabot[bot]'
        run: |
          echo "::error::Do not merge this pull request. Make the same update on your own branch and close this one."
          exit 1
