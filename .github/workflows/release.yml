name: Release

# Every push to main whose Cargo.toml version has no tag yet publishes that version.
# CI makes pull requests that change the app bump the version, so each app update ships.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Build Windows release
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Read version
        id: version
        shell: pwsh
        run: |
          $version = (cargo metadata --no-deps --format-version 1 | ConvertFrom-Json).packages[0].version
          "version=$version" >> $env:GITHUB_OUTPUT
          if (git tag --list "v$version") { "new=false" >> $env:GITHUB_OUTPUT } else { "new=true" >> $env:GITHUB_OUTPUT }

      - uses: dtolnay/rust-toolchain@stable
        if: steps.version.outputs.new == 'true'
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2
        if: steps.version.outputs.new == 'true'

      - name: Check, test and build
        if: steps.version.outputs.new == 'true'
        run: |
          cargo fmt --all -- --check
          cargo clippy --locked --all-targets -- -D warnings
          cargo test --locked
          cargo build --locked --release

      - name: Package release and checksum
        if: steps.version.outputs.new == 'true'
        shell: pwsh
        run: |
          $asset = "PhoneBackup-${{ steps.version.outputs.version }}-windows-x64.exe"
          Copy-Item "target/release/phone-backup.exe" $asset
          $hash = (Get-FileHash $asset -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $asset" | Set-Content "SHA256SUMS.txt" -Encoding ascii

      - name: Publish GitHub Release
        if: steps.version.outputs.new == 'true'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ steps.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: Phone Backup ${{ steps.version.outputs.version }}
          generate_release_notes: true
          prerelease: ${{ contains(steps.version.outputs.version, '-') }}
          fail_on_unmatched_files: true
          files: |
            PhoneBackup-${{ steps.version.outputs.version }}-windows-x64.exe
            SHA256SUMS.txt
