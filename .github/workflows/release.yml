name: Release

# Every merge to main that changes the app publishes a new version, numbered by itself:
# one past the newest release tag (1.0.1, 1.0.2, ...). To start a new minor or major
# version, raise `version` in Cargo.toml; the next release uses it, then counts on from it.
on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "companion/**"
      - "assets/**"
      - "build.rs"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/release.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Build Windows release
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Pick the next version
        id: version
        shell: pwsh
        run: |
          # A rerun on an already released commit publishes nothing.
          if (git tag --points-at HEAD --list "v*") { "new=false" >> $env:GITHUB_OUTPUT; exit 0 }
          $floor = (cargo metadata --no-deps --format-version 1 | ConvertFrom-Json).packages[0].version
          $last = git tag --list "v*" | Where-Object { $_ -match '^v\d+\.\d+\.\d+$' } |
            ForEach-Object { [version]$_.Substring(1) } | Sort-Object -Descending | Select-Object -First 1
          if ($floor -match '-' -or -not $last -or [version]$floor -gt $last) { $version = $floor }
          else { $version = "{0}.{1}.{2}" -f $last.Major, $last.Minor, ($last.Build + 1) }
          if (git tag --list "v$version") { throw "v$version is already released" }
          # The build carries the number, so the app shows it and Check for updates compares it.
          (Get-Content Cargo.toml -Raw) -replace '(?m)^version = ".*"', "version = `"$version`"" |
            Set-Content Cargo.toml -NoNewline
          (Get-Content Cargo.lock -Raw) -replace '(name = "phone-backup"\r?\nversion = )"[^"]*"', "`$1`"$version`"" |
            Set-Content Cargo.lock -NoNewline
          "version=$version" >> $env:GITHUB_OUTPUT
          "new=true" >> $env:GITHUB_OUTPUT

      - uses: dtolnay/rust-toolchain@stable
        if: steps.version.outputs.new == 'true'
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2
        if: steps.version.outputs.new == 'true'

      - uses: actions/setup-java@v6
        if: steps.version.outputs.new == 'true'
        with:
          distribution: temurin
          java-version: 21
          # Keeps Gradle and its downloads between runs, so later runs do not depend on the download servers.
          cache: gradle

      # Before cargo: build.rs embeds the APK in the app.
      - name: Build signed companion app
        if: steps.version.outputs.new == 'true'
        shell: pwsh
        env:
          COMPANION_KEYSTORE_BASE64: ${{ secrets.COMPANION_KEYSTORE_BASE64 }}
          COMPANION_KEY_PASSWORD: ${{ secrets.COMPANION_KEY_PASSWORD }}
        run: |
          $env:COMPANION_KEYSTORE = "$env:RUNNER_TEMP\companion.p12"
          [IO.File]::WriteAllBytes($env:COMPANION_KEYSTORE, [Convert]::FromBase64String($env:COMPANION_KEYSTORE_BASE64))
          companion\gradlew.bat -p companion assembleRelease
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Remove-Item $env:COMPANION_KEYSTORE

      - name: Check, test and build
        if: steps.version.outputs.new == 'true'
        run: |
          cargo fmt --all -- --check
          cargo clippy --locked --all-targets -- -D warnings
          cargo test --locked
          cargo build --locked --release

      - name: Package release and checksums
        if: steps.version.outputs.new == 'true'
        shell: pwsh
        run: |
          $asset = "PhoneBackup-${{ steps.version.outputs.version }}-windows-x64.exe"
          $helper = "PhoneBackupHelper-${{ steps.version.outputs.version }}.apk"
          Copy-Item "target/release/phone-backup.exe" $asset
          Copy-Item "companion/build/outputs/apk/release/companion-release.apk" $helper
          $asset, $helper | ForEach-Object { "$((Get-FileHash $_ -Algorithm SHA256).Hash.ToLowerInvariant())  $_" } | Set-Content "SHA256SUMS.txt" -Encoding ascii

      - name: Publish GitHub Release
        if: steps.version.outputs.new == 'true'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ steps.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: Phone Backup ${{ steps.version.outputs.version }}
          generate_release_notes: true
          prerelease: ${{ contains(steps.version.outputs.version, '-') }}
          fail_on_unmatched_files: true
          files: |
            PhoneBackup-${{ steps.version.outputs.version }}-windows-x64.exe
            PhoneBackupHelper-${{ steps.version.outputs.version }}.apk
            SHA256SUMS.txt
