name: Bug report
description: Something in Phone Backup doesn't work as it should.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report this. Please **don't attach real backups, contacts, messages, phone serial numbers or unredacted logs**. Describe what you saw instead.

        Found a security problem? Report it privately instead: see [SECURITY.md](https://github.com/mitunmanav/phone-backup/blob/main/SECURITY.md).
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you expect, and what happened instead?
      placeholder: I backed up my photos and the backup stopped at 40% with "Phone disconnected".
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to make it happen again
      placeholder: |
        1. Connect the phone over USB
        2. Open Back up and pick Photos
        3. Click Back up
    validations:
      required: true
  - type: input
    id: app-version
    attributes:
      label: Phone Backup version
      description: Shown in Settings under the app name, for example "Version 1.0.3".
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows version
      placeholder: Windows 11 24H2
    validations:
      required: true
  - type: input
    id: phone
    attributes:
      label: Phone and Android version
      placeholder: Pixel 8, Android 15
    validations:
      required: true
  - type: dropdown
    id: connection
    attributes:
      label: How was the phone connected?
      options:
        - USB with USB debugging (adb)
        - Wi-Fi
        - USB file transfer (MTP)
        - Not sure
    validations:
      required: true
  - type: textarea
    id: problem-list
    attributes:
      label: Problem list or error message
      description: If the app showed a problem list, click **Copy problem list** and paste it here. Remove any names or numbers you'd rather keep private.
      render: text
  - type: textarea
    id: extra
    attributes:
      label: Anything else?
      description: Screenshots help. Blur anything personal first.
