[package]
name = "phone-backup"
version = "0.2.0"
edition = "2024"
license = "GPL-3.0-or-later"
description = "Windows app that backs up an Android phone over USB, Wi-Fi or MTP"
repository = "https://github.com/mitunmanav/phone-backup"

[dependencies]
eframe = { version = "0.37.0", features = ["persistence"] }
mtp-rs = "0.35"
rfd = "0.17.2"
tokio = { version = "1", features = ["rt", "macros"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "gif"] }
sha2 = "0.10"
qrcodegen = "1.8.0"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem", "Win32_System_Diagnostics_Debug", "Win32_System_SystemInformation", "Win32_System_Power", "Win32_System_Time", "Win32_Foundation", "Win32_UI_Shell"] }
