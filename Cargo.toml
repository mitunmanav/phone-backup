[package]
name = "phone-backup"
version = "1.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
description = "Windows app that backs up an Android phone over USB, Wi-Fi or MTP"
repository = "https://github.com/mitunmanav/phone-backup"

[dependencies]
eframe = { version = "0.37.0", features = ["persistence"] }
mtp-rs = "0.37"
rfd = "0.17.2"
tokio = { version = "1", features = ["rt", "macros"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "gif"] }
sha2 = "0.11"
serde_json = "1"
qrcodegen = "1.8.0"
zune-heic = "0.5"
argon2 = { version = "0.6.0", default-features = false, features = ["alloc", "zeroize"] }
aes-gcm = { version = "0.11.1", default-features = false, features = ["aes", "alloc", "zeroize"] }
getrandom = "0.4"
hkdf = "0.13"
zeroize = "1.9"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem", "Win32_Media_Audio","Win32_System_SystemInformation", "Win32_System_Power", "Win32_System_Time", "Win32_Foundation", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[build-dependencies]
winresource = "0.1.34"

# Password keys take a moment even when optimised; unoptimised they take many seconds.
[profile.dev.package]
argon2 = { opt-level = 3 }
blake2 = { opt-level = 3 }
aes = { opt-level = 3 }
aes-gcm = { opt-level = 3 }
ghash = { opt-level = 3 }
polyval = { opt-level = 3 }
