[package]
name = "phone-backup"
version = "1.0.0"
edition = "2024"
license = "GPL-3.0-or-later"
description = "Windows app that backs up an Android phone over USB, Wi-Fi or MTP"
repository = "https://github.com/mitunmanav/phone-backup"

[dependencies]
eframe = { version = "0.37.0", features = ["persistence"] }
mtp-rs = "0.38"
rfd = "0.18.0"
tokio = { version = "1", features = ["rt", "macros"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "gif"] }
sha2 = "0.11"
serde_json = "1"
qrcodegen = "1.8.0"
zune-heic = "0.5"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem", "Win32_Media_Audio","Win32_System_SystemInformation", "Win32_System_Power", "Win32_System_Time", "Win32_Foundation", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[build-dependencies]
winresource = "0.1.34"

# The released exe: whole-program optimization and no debug symbols make it smaller and faster.
# Panics still unwind, so a failing job reports its error instead of closing the window.
[profile.release]
lto = "fat"
codegen-units = 1
strip = true

# Hashing and image decoding are slow unoptimized; tests and debug runs use optimized
# dependencies while the app's own code still builds quickly.
[profile.dev.package."*"]
opt-level = 2
